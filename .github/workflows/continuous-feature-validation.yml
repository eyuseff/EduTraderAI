name: Continuous feature validation

on:
  push:
    branches:
      - "feature/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY: ""
      ALPACA_SECRET_KEY: ""

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce protected-path safety boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          else
            RANGE="HEAD^...HEAD"
          fi

          CHANGED="$(git diff --name-only "$RANGE")"
          printf '%s\n' "$CHANGED"

          if printf '%s\n' "$CHANGED" | grep -E '(^|/)state(/|$)|(^|/)\.env($|\.)|credentials?|secrets?' >/dev/null; then
            echo "Protected path or credential-like file detected. Owner approval is required."
            exit 1
          fi

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run complete release gate
        run: make verify

      - name: Upload verification artifacts
        if: ${{ always() && hashFiles('build/verification.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-validation-${{ github.sha }}
          path: |
            build/coverage.json
            build/verification.json
          if-no-files-found: warn
