name: Continuous feature validation

on:
  push:
    branches:
      - "feature/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY: ""
      ALPACA_SECRET_KEY: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce protected-path safety boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          else
            RANGE="HEAD^...HEAD"
          fi

          CHANGED="$(git diff --name-only "$RANGE" || true)"
          printf '%s\n' "$CHANGED"

          if printf '%s\n' "$CHANGED" | grep -E '(^|/)state(/|$)|(^|/)\.env($|\.)|credentials?|secrets?' >/dev/null; then
            echo "Protected path or credential-like file detected. Owner approval is required."
            exit 1
          fi

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run complete release gate
        run: make verify

      - name: Upload verification artifacts
        if: ${{ always() && hashFiles('build/verification.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-validation-${{ github.sha }}
          path: |
            build/coverage.json
            build/verification.json
          if-no-files-found: warn
