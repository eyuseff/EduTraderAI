name: F7 format preview

on:
  push:
    branches:
      - feature/f7-congressional-intelligence

permissions:
  contents: write

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install Black
        run: python -m pip install "black==26.5.1"
      - name: Apply exact Black formatting
        run: |
          black global_rotation/congressional.py global_rotation/reporting.py tests/test_global_rotation_reporting.py
          if ! git diff --quiet -- global_rotation/congressional.py global_rotation/reporting.py tests/test_global_rotation_reporting.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add global_rotation/congressional.py global_rotation/reporting.py tests/test_global_rotation_reporting.py
            git commit -m "style: format F7 files"
            git push
          fi
