name: Performance regression gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY: ""
      ALPACA_SECRET_KEY: ""

    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate performance tooling
        run: |
          black --check \
            scripts/benchmark_noise_study.py \
            scripts/evaluate_benchmark_regression.py \
            tests/test_benchmark_noise_study.py \
            tests/test_benchmark_regression.py
          ruff check \
            scripts/benchmark_noise_study.py \
            scripts/evaluate_benchmark_regression.py \
            tests/test_benchmark_noise_study.py \
            tests/test_benchmark_regression.py
          python -m pytest -q \
            tests/test_benchmark_noise_study.py \
            tests/test_benchmark_regression.py

      - name: Run candidate benchmark noise study
        run: |
          python scripts/benchmark_noise_study.py \
            --repeats 7 \
            --iterations 300 \
            --warmup 30 \
            --output build/benchmark_candidate.json

      - name: Check out exact pull-request base
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _benchmark_base
          persist-credentials: false

      - name: Run base benchmark noise study
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python _benchmark_base/scripts/benchmark_noise_study.py \
            --repeats 7 \
            --iterations 300 \
            --warmup 30 \
            --output build/benchmark_reference.json

      - name: Evaluate paired performance regression
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python scripts/evaluate_benchmark_regression.py \
            --reference build/benchmark_reference.json \
            --candidate build/benchmark_candidate.json \
            --noise-baseline docs/roadmap/V41_BENCHMARK_NOISE_BASELINE_2026-08-16.json \
            --output build/benchmark_regression.json

      - name: Upload performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-regression-${{ github.sha }}
          path: |
            build/benchmark_candidate.json
            build/benchmark_reference.json
            build/benchmark_regression.json
          if-no-files-found: warn
